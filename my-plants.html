<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantie - הצמחים שלי</title>
<meta name="description" content="כל הצמחים ששמרתם ב-Plantie, במקום אחד.">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">

<body>
<main class="app-shell has-bottom-nav flat-bg">

  <header class="top-bar center-logo">
    <img class="logo-img" src="assets/images/logo.png" alt="Plantie">
    <a class="top-bar-btn menu" href="menu.html" data-menu-open aria-label="פתח תפריט">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </a>
  </header>

  <form action="#" role="search" style="padding: 8px 20px 4px;">
    <label class="visually-hidden" for="plant-search">חיפוש צמח</label>
    <div class="search-field">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><line x1="20" y1="20" x2="15.2" y2="15.2"/></svg>
      <input class="field" type="search" id="plant-search" name="q" placeholder="חיפוש צמח" dir="rtl">
    </div>
  </form>

  <div class="chip-row" role="group" aria-label="סינון צמחים">
    <button class="chip is-active" type="button" data-filter="all" aria-pressed="true">הכל</button>
    <button class="chip" type="button" data-filter="inside" aria-pressed="false">צמחי פנים</button>
    <button class="chip" type="button" data-filter="outside" aria-pressed="false">צמחי חוץ</button>
    <button class="chip" type="button" data-filter="water" aria-pressed="false">דורש טיפול</button>
    <button class="chip chip-add" type="button" aria-label="הוסף מסנן">
      <svg class="icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="square" aria-hidden="true"><line x1="12" y1="4" x2="12" y2="20"/><line x1="4" y1="12" x2="20" y2="12"/></svg>
    </button>
  </div>

  <!-- כרטיסי הצמחים נבנים בפועל על ידי script.js (renderPlantGrid) מתוך
       רשימת "הצמחים שלי" השמורה (localStorage) + טבלת PLANT_DATA - ראו שם.
       נשאר ריק כאן בכוונה, אין יותר HTML קבוע של צמחים ספציפיים. -->
  <div class="plant-grid"></div>

  <!-- מסך "עוד אין כאן צמחים" (Figma: my plants screen_3_empty, node 183:1255) -
       script.js מציג את זה במקום plant-grid כשרשימת "הצמחים שלי" ריקה. -->
  <div class="myplants-empty" data-myplants-empty hidden>
    <h1>עוד אין כאן צמחים</h1>
    <p>זה הזמן להוסיף את הצמח הראשון שלך!</p>
