<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Plantie - התחברות</title>
<meta name="description" content="Plantie - האפליקציה שעוזרת לכם לשמור על הצמחים שלכם בריאים ושמחים.">
<link rel="stylesheet" href="style.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<main class="app-shell">
  <div class="open-screen">
    <img class="logo-img" src="assets/images/logo.png" alt="Plantie">
    <img class="hero-img" src="assets/images/plant-heartleaf-philodendron.png" alt="איור של פילודנדרון לבבי בעציץ">

    <h1>איזה כיף שהגעת!</h1>
    <p class="lede">אנחנו נעזור לך לשמור על הצמחים שלך בריאים ושמחים!</p>

    <form action="#" method="post">
      <div class="field-group">
        <label class="visually-hidden" for="email">אימייל</label>
        <input class="field" type="email" id="email" name="email" placeholder="אימייל" autocomplete="email" dir="rtl" required>

        <label class="visually-hidden" for="password">סיסמה</label>
        <input class="field" type="password" id="password" name="password" placeholder="סיסמה" autocomplete="current-password" dir="rtl" required>
      </div>

      <a class="forgot" href="#">שכחת את הסיסמה?</a>

      <div class="actions">
        <button class="btn btn-primary" type="button" id="login-submit">התחברות</button>
        <button class="btn btn-secondary" type="button">
          <svg class="icon-sm" viewBox="0 0 24 24" aria-hidden="true"><path fill="#4285F4" d="M22.5 12.2c0-.8-.1-1.5-.2-2.2H12v4.3h5.9c-.3 1.4-1 2.5-2.2 3.3v2.7h3.6c2.1-2 3.2-4.8 3.2-8.1z"/><path fill="#34A853" d="M12 23c3 0 5.5-1 7.3-2.7l-3.6-2.7c-1 .7-2.2 1.1-3.7 1.1-2.9 0-5.3-1.9-6.2-4.6H2.1v2.8C3.9 20.5 7.6 23 12 23z"/><path fill="#FBBC05" d="M5.8 14.1c-.2-.7-.4-1.4-.4-2.1s.1-1.4.4-2.1V7.1H2.1C1.4 8.5 1 10.2 1 12s.4 3.5 1.1 4.9l3.7-2.8z"/><path fill="#EA4335" d="M12 5.4c1.6 0 3.1.6 4.2 1.7l3.2-3.2C17.5 2.1 15 1 12 1 7.6 1 3.9 3.5 2.1 7.1l3.7 2.8c.9-2.7 3.3-4.5 6.2-4.5z"/></svg>
          התחברות עם Google
        </button>
      </div>
    </form>
  </div>
</main>
<script src="script.js" defer></script>
</body>
</html>
